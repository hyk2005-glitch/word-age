# 언어 나이 진단기 - 질문 뱅크
#
# type: choice  -> 객관식. 각 option은 word_lifecycle.parquet에 실존해야 하는 word를 직접 지정한다.
# type: text    -> 서술형. 자유 입력 텍스트를 matcher.py가 명사 추출해 word_lifecycle과 대조한다.
#
# implicit_age  -> 이 질문이 묻는 시절의 암묵 나이(추정_출생연도 = peak_year - implicit_age)
# confidence    -> 이 질문 유형이 갖는 신뢰도. 객관식(단어 확정)이 서술형(추출 오차 존재)보다 높다.
#
# 회의록 기준: 객관식 5~6문항, 서술형 3문항. implicit_age 예시 -
#   어릴 때 쓰던 물건 ≈ 9세 / 학창 시절 표현 ≈ 15세 / 기억나는 유행어 ≈ 17세
#
# 주의: 옵션 word는 신문 말뭉치(뉴스 텍스트) 기반 실제 파이프라인 산출물과 대조해 골랐다.
# 뉴스 말뭉치 특성상 순수 인터넷 은어(오운완, 미니홈피, 즐 등)는 total_freq가 0이거나
# 극히 낮아 word_lifecycle.parquet에 아예 없거나 신뢰하기 어렵다. 옵션을 추가/교체할 때는
# 반드시 word_lifecycle.parquet에서 해당 word의 존재 여부와 total_freq(표본 크기),
# sharpness(시대 특정력)를 확인할 것 - freq가 너무 낮으면(대략 20 미만) 추정치가 노이즈에
# 가깝고, sharpness가 낮으면(대략 1.5 미만) 특정 시기를 가리키는 힘이 약하다.

questions:
